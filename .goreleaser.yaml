version: 2

project_name: kuargogo

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/kgg
    ldflags:
      - -s -w
      - -X github.com/DannyStrelok/kuargogo/internal/version.Current={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
    binary: kgg

archives:
  - id: default
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
