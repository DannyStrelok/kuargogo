---
- name: Ensure cert-manager namespace exists
  kubernetes.core.k8s:
    name: "{{ cert_manager_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Add Jetstack cert-manager Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: "https://charts.jetstack.io"

- name: Deploy cert-manager via Helm
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: "{{ cert_manager_namespace }}"
    chart_version: "{{ cert_manager_version }}"
    values:
      crds:
        enabled: true
      resources:
        requests:
          memory: "64Mi"
        limits:
          memory: "128Mi"
      prometheus:
        enabled: true
        servicemonitor:
          enabled: true

- name: Wait for cert-manager webhook to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: "{{ cert_manager_namespace }}"
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Available
      status: "True"

- name: Create Cloudflare API Token Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token-secret
        namespace: "{{ cert_manager_namespace }}"
      type: Opaque
      stringData:
        api-token: "{{ cloudflare_api_token }}"
  when: cloudflare_api_token != ""

- name: Template ClusterIssuer
  template:
    src: clusterissuer.yaml.j2
    dest: /tmp/clusterissuer.yaml
  when: cloudflare_api_token != ""

- name: Apply ClusterIssuer for Let's Encrypt DNS-01
  kubernetes.core.k8s:
    state: present
    src: /tmp/clusterissuer.yaml
  when: cloudflare_api_token != ""

- name: Clean up temporary clusterissuer file
  file:
    path: /tmp/clusterissuer.yaml
    state: absent
  when: cloudflare_api_token != ""
