- name: Validate Cloudflare variables
  fail:
    msg: "⚠️  Cloudflare Tunnel Token is missing! Please run 'kgg config set-cloudflare' first."
  when: cloudflare_tunnel_token | default('') == ''
  tags: [validate, cloudflare]

- name: Ensure Cloudflare namespace exists
  kubernetes.core.k8s:
    name: "{{ cloudflare_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Create Cloudflare Tunnel Token Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflared-tunnel-token
        namespace: "{{ cloudflare_namespace }}"
      type: Opaque
      stringData:
        tunnel-token: "{{ cloudflare_tunnel_token }}"
  when: cloudflare_tunnel_token != ""

- name: Deploy Cloudflared Deployment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
        namespace: "{{ cloudflare_namespace }}"
        labels:
          app: cloudflared
      spec:
        replicas: "{{ cloudflared_replicas }}"
        selector:
          matchLabels:
            app: cloudflared
        template:
          metadata:
            labels:
              app: cloudflared
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchExpressions:
                        - key: app
                          operator: In
                          values:
                            - cloudflared
                    topologyKey: "kubernetes.io/hostname"
            containers:
              - name: cloudflared
                image: "cloudflare/cloudflared:{{ cloudflared_image_version }}"
                args:
                  - tunnel
                  - --no-autoupdate
                  - run
                env:
                  - name: TUNNEL_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: cloudflared-tunnel-token
                        key: tunnel-token
                resources:
                  requests:
                    cpu: 10m
                    memory: 50Mi
                  limits:
                    memory: 256Mi
            restartPolicy: Always
  when: cloudflare_tunnel_token != ""
