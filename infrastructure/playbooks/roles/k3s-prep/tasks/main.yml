---
# =================================================================
# Kubernetes Node Preparation Role
# Includes networking, storage, and kernel tuning specifically for K3s.
# =================================================================

# =================================================================
# TASK 1: Swap Management
# K3s requires swap to be disabled for stable performance.
# =================================================================
- name: Disable swap (runtime)
  command: swapoff -a
  changed_when: false
  tags: [swap]

- name: Disable swap (fstab)
  replace:
    path: /etc/fstab
    regexp: '^(\S+\s+[^#]\S+\s+swap\s+\S+\s+\S+\s+\S+.*)$'
    replace: '#\1'
  tags: [swap]

- name: Disable dphys-swapfile (ARM/Pi)
  systemd:
    name: dphys-swapfile
    state: stopped
    enabled: no
  when: ansible_architecture is search('arm') or ansible_architecture == 'aarch64'
  tags: [swap]

- name: Disable zram tools (Fake swap in memory)
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - zram-tools
    - zram-config
    - systemd-zram-setup@zram0.service
  failed_when: false
  tags: [swap]

# =================================================================
# TASK 1.1: Storage Dependencies (Longhorn)
# =================================================================
- name: Install K3s and Storage dependencies
  apt:
    name:
      - conntrack
      - socat
      - ipset
      - xfsprogs
      - apparmor
      - apparmor-utils
      - apparmor-profiles
      - multipath-tools
      - open-iscsi
      - nfs-common
      - cryptsetup
    state: present
  tags: [storage, kernel, packages]

# =================================================================
# TASK 2: Kernel Modules
# Required for K3s overlay networking and Longhorn storage.
# =================================================================
- name: Load kernel modules for K3s
  modprobe:
    name: "{{ item }}"
  loop:
    - overlay
    - br_netfilter
    - dm-crypt
  failed_when: false
  tags: [kernel]

- name: Persistent kernel modules
  copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
      dm-crypt
  tags: [kernel]

- name: Apply K3s-specific sysctl settings
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.ipv6.conf.all.forwarding", value: "1" }
    - { key: "net.ipv6.conf.default.forwarding", value: "1" }
    - { key: "vm.swappiness", value: "0" }
    - { key: "vm.overcommit_memory", value: "1" }
    - { key: "fs.file-max", value: "1000000" }
    - { key: "kernel.pid_max", value: "4194304" }
    - { key: "fs.inotify.max_user_instances", value: "8192" }
    - { key: "fs.inotify.max_user_watches", value: "524288" }
    - { key: "net.core.somaxconn", value: "32768" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
    - { key: "net.core.rmem_max", value: "16777216" }
    - { key: "net.core.wmem_max", value: "16777216" }
  tags: [kernel]

# =================================================================
# TASK 3: Etcd Disk Latency Check
# Etcd is sensitive to disk I/O latency.
# =================================================================
- name: Measure disk write latency for Etcd
  shell: |
    dd if=/dev/zero of=/tmp/etcd_latency_test bs=512 count=1000 oflag=dsync 2>&1 | grep -oE '[0-9.]+ (MB|kB)/s'
  register: disk_latency
  changed_when: false
  tags: [kernel, monitoring]

- name: Alert if disk is potentially too slow for Etcd
  debug:
    msg: "⚠️  WARNING: Disk write performance is low ({{ disk_latency.stdout }}). Etcd requires low latency for HA stability."
  when: "'kB/s' in disk_latency.stdout"
  tags: [kernel, monitoring]

- name: Cleanup latency test file
  file:
    path: /tmp/etcd_latency_test
    state: absent
  tags: [kernel, monitoring]

# =================================================================
# TASK 5: Multipath Blacklist
# Needed for Longhorn to avoid conflicts with shared storage.
# =================================================================
- name: Configure multipath blacklist
  copy:
    dest: /etc/multipath.conf
    content: |
      blacklist {
          devnode "^sd[a-z0-9]+"
          devnode "^nvme[0-9]+"
      }
  notify: Restart Multipathd
  tags: [storage]

# =================================================================
# TASK 6: K3s Firewall Support
# =================================================================
- name: Allow K3s API Server
  ufw:
    rule: allow
    port: 6443
    proto: tcp
    comment: "K3s API Server"
  tags: [firewall]

- name: Allow Etcd HA
  ufw:
    rule: allow
    port: 2379:2380
    proto: tcp
    comment: "Etcd HA"
  tags: [firewall]

- name: Allow Etcd Metrics
  ufw:
    rule: allow
    port: 2381
    proto: tcp
    comment: "Etcd Metrics"
  tags: [firewall]

- name: Allow Kube-VIP VRRP Protocol
  ufw:
    rule: allow
    proto: "{{ kubevip_protocol | default('vrrp') }}"
    comment: "Kube-VIP VRRP"
  tags: [firewall]

- name: Allow Kube-VIP BGP Port
  ufw:
    rule: allow
    port: 179
    proto: tcp
    comment: "Kube-VIP BGP"
  tags: [firewall]

- name: Allow Kubelet API
  ufw:
    rule: allow
    port: 10250
    proto: tcp
    comment: "Kubelet API"
  tags: [firewall]

- name: Allow Flannel VXLAN
  ufw:
    rule: allow
    port: 8472
    proto: udp
    comment: "Flannel VXLAN"
  tags: [firewall]

- name: Allow Longhorn Manager
  ufw:
    rule: allow
    port: 9500:9504
    proto: tcp
    comment: "Longhorn Manager"
  tags: [firewall]

- name: Allow Longhorn Health
  ufw:
    rule: allow
    port: 2701
    proto: tcp
    comment: "Longhorn Health"
  tags: [firewall]

- name: Allow Longhorn iSCSI
  ufw:
    rule: allow
    port: 3260
    proto: tcp
    comment: "Longhorn iSCSI"
  tags: [firewall]

- name: Allow K3s NodePort range
  ufw:
    rule: allow
    port: 30000:32767
    proto: tcp
    comment: "K3s NodePorts"
  tags: [firewall]

- name: Allow K3s Pod Network
  ufw:
    rule: allow
    src: "{{ k3s_pod_cidr | default('10.42.0.0/16') }}"
    comment: "K3s Pods"
  tags: [firewall]

- name: Allow K3s Service Network
  ufw:
    rule: allow
    src: "{{ k3s_service_cidr | default('10.43.0.0/16') }}"
    comment: "K3s Services"
  tags: [firewall]
# =================================================================
# TASK 7: ARM64 Cgroups (K3s Pi Nodes)
# =================================================================
- name: Check if cgroups are already enabled in cmdline.txt
  command: grep -q "cgroup_enable=cpuset" /boot/firmware/cmdline.txt
  register: cgroup_check
  failed_when: false
  changed_when: false
  when: ansible_architecture is search('arm') or ansible_architecture == 'aarch64'
  tags: [cgroups, hardware]

- name: Enable cgroups in cmdline.txt (ARM64)
  replace:
    path: /boot/firmware/cmdline.txt
    regexp: "^((?!.*cgroup_enable=memory).+)$"
    replace: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
  when:
    - (ansible_architecture is search('arm') or ansible_architecture == 'aarch64')
    - cgroup_check.rc != 0
  tags: [cgroups, hardware]

- name: Mark reboot required if cgroups changed
  file:
    path: /var/run/reboot-required
    state: touch
  when:
    - (ansible_architecture is search('arm') or ansible_architecture == 'aarch64')
    - cgroup_check.rc != 0
  tags: [cgroups, hardware]
