---

- name: Create credentials file from template
  template:
    src: credentials-velero.j2
    dest: "/tmp/credentials-velero"
    mode: '0600'
  when: velero_s3_access_key != ""

- name: Create Velero credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloud-credentials
        namespace: "{{ velero_namespace }}"
      type: Opaque
      stringData:
        cloud: "{{ lookup('file', '/tmp/credentials-velero') }}"
  when: velero_s3_access_key != ""

- name: Add VMware Tanzu Helm repository
  kubernetes.core.helm_repository:
    name: vmware-tanzu
    repo_url: "https://vmware-tanzu.github.io/helm-charts"

- name: Deploy Velero via Helm
  kubernetes.core.helm:
    name: velero
    chart_ref: vmware-tanzu/velero
    release_namespace: "{{ velero_namespace }}"
    chart_version: "{{ velero_chart_version }}"
    create_namespace: true
    values:
      configuration:
        provider: "{{ velero_provider }}"
        backupStorageLocation:
          - name: default
            provider: "{{ velero_provider }}"
            bucket: "{{ velero_s3_bucket }}"
            config:
              region: "{{ velero_s3_region }}"
              s3Url: "{{ velero_s3_url }}"
              s3ForcePathStyle: true
      initContainers:
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.10.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /target
              name: plugins
      credentials:
        useSecret: true
        existingSecret: cloud-credentials
      deployNodeAgent: true

- name: Clean up temporary credentials file
  file:
    path: "/tmp/credentials-velero"
    state: absent
  when: velero_s3_access_key != ""
