---
# update.yml - System maintenance playbook
# Updates all packages and cleans up the system

- name: System Update and Maintenance
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      when: ansible_os_family == "Debian"
      register: upgrade_result

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display upgrade summary
      debug:
        msg: |
          Host: {{ inventory_hostname }}
          Packages upgraded: {{ upgrade_result.changed | default(false) }}
          Reboot required: {{ reboot_required.stat.exists | default(false) }}

    - name: Notify if reboot is needed
      debug:
        msg: "⚠️  REBOOT REQUIRED on {{ inventory_hostname }}"
      when: reboot_required.stat.exists | default(false)
