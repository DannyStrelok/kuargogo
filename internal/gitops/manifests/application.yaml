apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    managed-by: kuargogo
  finalizers:
  - argocd.argoproj.io/resources-finalizer
spec:
  project: {{.Project}}
  {{- if .IsHelm}}
  {{- if .ValuesFile}}
  sources:
  - repoURL: {{.Repo | yamlQuote}}
    chart: {{.Chart | yamlQuote}}
    targetRevision: {{.ChartVersion | yamlQuote}}
    helm:
      valueFiles:
      - $values/{{.ValuesFile}}
  - repoURL: {{.ValuesRepo | yamlQuote}}
    targetRevision: {{.ValuesBranch | yamlQuote}}
    ref: values
  {{- else}}
  source:
    repoURL: {{.Repo | yamlQuote}}
    chart: {{.Chart | yamlQuote}}
    targetRevision: {{.ChartVersion | yamlQuote}}
  {{- end}}
  {{- else}}
  source:
    repoURL: {{.Repo | yamlQuote}}
    targetRevision: {{.Branch | yamlQuote}}
    path: {{.Path | yamlQuote}}
  {{- end}}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{.TargetNamespace}}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  ignoreDifferences:
  - group: postgresql.cnpg.io
    kind: Cluster
    jsonPointers:
    - /spec/storage/pvcTemplate/metadata
    - /spec/walStorage/pvcTemplate/metadata
    - /spec/managed/roles
    - /spec/plugins
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: StatefulSet
    jqPathExpressions:
    - .spec.volumeClaimTemplates[].apiVersion
    - .spec.volumeClaimTemplates[].kind
