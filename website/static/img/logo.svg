<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Neon Glow Filters -->
    <filter id="glow-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-spark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background neon sign arch outline -->
  <path d="M18 85 C18 38, 82 38, 82 85" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.65" filter="url(#glow-blue)" />
  <path d="M12 85 C12 30, 88 30, 88 85" fill="none" stroke="#ff2a5f" stroke-width="2.2" opacity="0.65" filter="url(#glow-red)" />

  <!-- Gopher Body Outline (Red/Orange Neon) -->
  <!-- Head & Body -->
  <path d="M33 50 C33 31, 67 31, 67 50 C67 62, 64 78, 64 85 L36 85 C36 78, 33 62, 33 50 Z" 
        fill="#0b0c10" stroke="#ff5e3a" stroke-width="3.5" filter="url(#glow-red)" />
  
  <!-- Ears -->
  <circle cx="36" cy="34" r="5.5" fill="#0b0c10" stroke="#ff5e3a" stroke-width="2.8" filter="url(#glow-red)" />
  <circle cx="64" cy="34" r="5.5" fill="#0b0c10" stroke="#ff5e3a" stroke-width="2.8" filter="url(#glow-red)" />

  <!-- Eyes -->
  <circle cx="43" cy="46" r="5" fill="#ffffff" />
  <circle cx="44" cy="46" r="2.2" fill="#000000" />
  
  <circle cx="57" cy="46" r="5" fill="#ffffff" />
  <circle cx="56" cy="46" r="2.2" fill="#000000" />

  <!-- Nose & Snout -->
  <ellipse cx="50" cy="52" rx="4" ry="2.5" fill="#ff5e3a" stroke="#ff9f80" stroke-width="1.2" />
  <!-- Teeth -->
  <rect x="48.2" y="54.5" width="1.6" height="3" fill="#ffffff" rx="0.4" />
  <rect x="50.2" y="54.5" width="1.6" height="3" fill="#ffffff" rx="0.4" />

  <!-- Cables (Orange/Yellow Neon) -->
  <path d="M14 74 Q27 67, 42 68" fill="none" stroke="#ffaa00" stroke-width="3" stroke-linecap="round" filter="url(#glow-red)" />
  <path d="M86 74 Q73 67, 58 68" fill="none" stroke="#ffaa00" stroke-width="3" stroke-linecap="round" filter="url(#glow-red)" />
  
  <!-- Gopher Paws holding cables -->
  <circle cx="41" cy="68" r="2.2" fill="#ff5e3a" />
  <circle cx="59" cy="68" r="2.2" fill="#ff5e3a" />

  <!-- The Spark! -->
  <g transform="translate(50, 68)">
    <!-- Radial ray glow -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" filter="url(#glow-spark)" opacity="0.95" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    <!-- Rays -->
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-width="2" />
    <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5" stroke="#ffd700" stroke-width="1.5" />
    <line x1="8.5" y1="-8.5" x2="-8.5" y2="8.5" stroke="#ffd700" stroke-width="1.5" />
  </g>
</svg>